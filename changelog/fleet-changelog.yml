  - version: 4.89.0
    date: '2026-07-15'
    breaking: false
    highlights:
      - Added include/exclude label targeting for policies.
      - Added POST /api/v1/fleet/policies/:policy_id/reset to reset a policy's pass/fail results.
      - Added GET /api/v1/fleet/policies/:id/automation_activities to list policy automation activities.
      - Added ability to keep Fleet-maintained apps auto-updated, pinned, or rolled back (Premium).
      - Added Google Workspace integration mapping IdP users to hosts for host vitals.
