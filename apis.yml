aid: fleet
name: Fleet
description: >-
  Fleet is an open-source device management platform built on osquery. It provides
  cross-platform MDM, endpoint telemetry, vulnerability and patch management,
  software inventory, and GitOps-driven configuration for macOS, Windows, Linux,
  iOS, and Android fleets. Fleet exposes a versioned REST API (/api/v1/fleet,
  bearer-token auth), the fleetctl CLI for live queries and config-as-code, and
  outbound webhook automations. It is developed in the open at github.com/fleetdm/fleet
  and backed by CRV.
